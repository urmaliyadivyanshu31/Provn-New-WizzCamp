<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definition for the logo -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6d01;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6d01;stop-opacity:0.8" />
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#0d1117" stroke="#ff6d01" stroke-width="2" opacity="0.1"/>
  
  <!-- Main logo icon with glow -->
  <g filter="url(#glow)">
    <!-- Rounded rectangle background -->
    <rect x="70" y="70" width="60" height="60" rx="12" ry="12" fill="url(#logoGradient)"/>
    
    <!-- Inner rotated square -->
    <rect x="85" y="85" width="30" height="30" rx="4" ry="4" fill="#0d1117" transform="rotate(12 100 100)"/>
  </g>
  
  <!-- Subtle glow background -->
  <rect x="70" y="70" width="60" height="60" rx="12" ry="12" fill="#ff6d01" opacity="0.3" style="filter: blur(8px);"/>
  
</svg>