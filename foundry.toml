[profile.default]
src = "src"
out = "out"
libs = [
    "lib",
    "node_modules",
]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "hardhat/=node_modules/hardhat/",
]
solc_version = "0.8.29"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
basecamp = "https://basecamp.cloud.blockscout.com/rpc/http"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
